
apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deploy
  namespace: taskops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend-pod
          image: taskops-frontend:v3
          imagePullPolicy: Never

          ports:
            - containerPort: 80

          # Backend Kubernetes Service hostname
          env:
            - name: BACKEND_HOST
              value: "springboot-service"

            # Backend Kubernetes Service port
            - name: BACKEND_PORT
              value: "8085"
