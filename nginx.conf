
server {
    listen 80;

    # React static files
    root /usr/share/nginx/html;
    index index.html;

    # Backend address provided at container startup
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_set_header Host $host;
    }

    # React client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
